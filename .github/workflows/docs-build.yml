name: Docs build

# Runs when a version tag is pushed: builds the documentation site and publishes
# the production output on its own branch, so `main` stays source-only and
# deployments can pull a ready-made artifact. The branch root is the deployable
# directory: `server.js`, `package.json`, and `public/` (run it with
# `node server.js`; serve `public/` from the deployment root).
on:
  push:
    tags:
      - "@humjs/core@*"
      - "@humjs/vite-plugin@*"
      - "create-hum@*"
  # Lets a maintainer rebuild the site from `main` by hand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISH_BRANCH: docs
    steps:
      # The v6 majors run on the node24 action runtime; earlier majors still
      # target node20, which GitHub now forces onto node24.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish the build output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/docs-publish"
          mkdir -p "$publish_dir"
          cp -R packages/docs/dist/. "$publish_dir/"

          # Guard against publishing a half-finished build.
          test -f "$publish_dir/server.js"
          test -f "$publish_dir/package.json"
          test -d "$publish_dir/public/_hum"

          cd "$publish_dir"
          # The branch carries artifacts only, so every run replaces it with a
          # single fresh commit instead of growing a history of build outputs.
          git init -q -b "$PUBLISH_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --force
          git commit -q -m "chore: build docs from ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$PUBLISH_BRANCH"
